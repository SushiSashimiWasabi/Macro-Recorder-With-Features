# Builds the app for Windows and Mac on GitHub's computers, every time code is pushed
# (or by hand: Actions > Build > Run workflow). The results are on the run's page, under
# "Artifacts": MacroRecorder-Windows (the folder build as MacroRecorder-Windows.zip, and the same app
# as one file, MacroRecorder.exe), MacroRecorder-Mac-AppleSilicon, MacroRecorder-Mac-Intel.
#
# Releases: when APP_VERSION in "Source code/version.py" is a version that has no Release yet,
# a push to main also publishes Release v<version>. The Windows files go out first, so a slow
# Mac queue never holds Windows updates back; each Mac zip is added to that Release when its
# build finishes. Every copy of the app checks the latest Release when it starts.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    # every test group (see tests.yml); if any fails, nothing is built or published
    uses: ./.github/workflows/tests.yml

  windows:
    needs: [tests]
    # builds only in the public repo (the private one is for testing previews: tests only)
    if: github.repository == 'SushiSashimiWasabi/Macro-Recorder-With-Features'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip  # (downloads kept between runs: quicker)
          cache-dependency-path: "Source code/requirements.txt"
      - name: Build the folder build (zip) and the one-file MacroRecorder.exe
        shell: cmd
        run: |
          py -m pip install --upgrade pyinstaller -r "Source code\requirements.txt" || exit /b 1
          py -m PyInstaller --noconfirm --clean "Source code\MacroRecorder_win.spec" || exit /b 1
          tar -a -c -f MacroRecorder-Windows.zip -C dist\MacroRecorder MacroRecorder.exe _internal || exit /b 1
          set MR_ONEFILE=1
          rem (no --clean: reuses the folder build's work, only the exe is packed differently)
          py -m PyInstaller --noconfirm "Source code\MacroRecorder_win.spec" || exit /b 1
          copy /y dist\MacroRecorder.exe MacroRecorder.exe || exit /b 1
      - uses: actions/upload-artifact@v6
        with:
          name: MacroRecorder-Windows
          path: |
            MacroRecorder-Windows.zip
            MacroRecorder.exe

  release:
    # only from main; publishes the Windows files as soon as they're built (the zip for copies from
    # 2.8 on, the one-file exe for older copies, which can only update to one file)
    # (never from the private repo: the app's updater reads the public repo's Releases)
    if: github.ref == 'refs/heads/main' && github.repository == 'SushiSashimiWasabi/Macro-Recorder-With-Features'
    needs: [windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      created: ${{ steps.ver.outputs.exists == 'no' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v6
      - name: Read the version
        id: ver
        run: |
          v=$(sed -n 's/^APP_VERSION *= *"\(.*\)"/\1/p' "Source code/version.py" | tr -d '\r')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=yes" >> "$GITHUB_OUTPUT"; else echo "exists=no" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v7
        if: steps.ver.outputs.exists == 'no'
        with:
          name: MacroRecorder-Windows
          path: builds
      - name: Publish Release v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.exists == 'no'
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "Macro Recorder ${{ steps.ver.outputs.version }}" \
            --notes "$(git log -1 --format=%B | grep -v '^Co-Authored-By:')" \
            --target "${{ github.sha }}" \
            builds/MacroRecorder-Windows.zip builds/MacroRecorder.exe
        env:
          GH_TOKEN: ${{ github.token }}

  mac:
    needs: [release]
    # also runs when there's no release step (not on main); only in the public repo
    if: ${{ !cancelled() && github.repository == 'SushiSashimiWasabi/Macro-Recorder-With-Features' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple Silicon (M1 and newer); pinned instead of the busy macos-latest
            label: AppleSilicon
          - runner: macos-15-intel   # older Intel Macs
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip  # (downloads kept between runs: quicker)
          cache-dependency-path: "Source code/requirements.txt"
      - name: Build MacroRecorder.app
        run: bash build_mac.sh
      - name: Zip it (keeps the app bundle intact)
        run: ditto -c -k --keepParent "Mac build version/MacroRecorder.app" MacroRecorder-Mac-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: MacroRecorder-Mac-${{ matrix.label }}
          path: MacroRecorder-Mac-${{ matrix.label }}.zip
      - name: Add it to Release v${{ needs.release.outputs.version }}
        if: needs.release.outputs.created == 'yes'
        run: gh release upload "v${{ needs.release.outputs.version }}" MacroRecorder-Mac-${{ matrix.label }}.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
