# Builds the app for Windows and Mac on GitHub's computers, every time code is pushed
# (or by hand: Actions > Build > Run workflow). The results are on the run's page, under
# "Artifacts": MacroRecorder-Windows, MacroRecorder-Mac-AppleSilicon, MacroRecorder-Mac-Intel.
#
# Releases: when APP_VERSION in "Source code/version.py" is a version that has no Release yet,
# a push to main also publishes Release v<version>. The Windows exe goes out first, so a slow
# Mac queue never holds Windows updates back; each Mac zip is added to that Release when its
# build finishes. Every copy of the app checks the latest Release when it starts.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build MacroRecorder.exe
        shell: cmd
        run: |
          py -m pip install --upgrade pyinstaller -r "Source code\requirements.txt" || exit /b 1
          py -m PyInstaller --noconfirm --clean "Source code\MacroRecorder_win.spec"
      - uses: actions/upload-artifact@v4
        with:
          name: MacroRecorder-Windows
          path: dist/MacroRecorder.exe

  release:
    # only from main; publishes the Windows exe as soon as it's built
    if: github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      created: ${{ steps.ver.outputs.exists == 'no' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: ver
        run: |
          v=$(sed -n 's/^APP_VERSION *= *"\(.*\)"/\1/p' "Source code/version.py" | tr -d '\r')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=yes" >> "$GITHUB_OUTPUT"; else echo "exists=no" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.exists == 'no'
        with:
          name: MacroRecorder-Windows
          path: builds
      - name: Publish Release v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.exists == 'no'
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "Macro Recorder ${{ steps.ver.outputs.version }}" \
            --notes "$(git log -1 --format=%B | grep -v '^Co-Authored-By:')" \
            --target "${{ github.sha }}" \
            builds/MacroRecorder.exe
        env:
          GH_TOKEN: ${{ github.token }}

  mac:
    needs: [release]
    if: ${{ !cancelled() }}   # also runs when there's no release step (not on main)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple Silicon (M1 and newer); pinned instead of the busy macos-latest
            label: AppleSilicon
          - runner: macos-15-intel   # older Intel Macs
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build MacroRecorder.app
        run: bash build_mac.sh
      - name: Zip it (keeps the app bundle intact)
        run: ditto -c -k --keepParent "Mac build version/MacroRecorder.app" MacroRecorder-Mac-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacroRecorder-Mac-${{ matrix.label }}
          path: MacroRecorder-Mac-${{ matrix.label }}.zip
      - name: Add it to Release v${{ needs.release.outputs.version }}
        if: needs.release.outputs.created == 'yes'
        run: gh release upload "v${{ needs.release.outputs.version }}" MacroRecorder-Mac-${{ matrix.label }}.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
